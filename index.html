<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skycast - Weather Dashboard</title>
   <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="styles.css">
 
</head>
<body>
    <header>
        <div class="logo" > <span>☀️ </span></div> <h1> Skycast</h1>
        <form class="search" >
        <input type="text"  placeholder="Search for a city…">
        <button type="submit" >Search</button>
        </form>
        <nav >
          <a href="#"  class="active">Today</a>
          <a href="#">Forecast</a>
     
    </nav>
    </header>
    <main >
      <section class="current">
        <div class="updated">Updated 10:30</div>

        <div class="current-top">
          <div>
            <h2 class="location">Current weather</h2>
            <p class="city">London, UK</p>
            <small">Monday, 16 September</small>
          </div>
          <div class="weather-img">🌤️</div>
          </div>

          <div class="current-bottom">
            <div class="degrees"><span>18</span>°C </span> </div>

                <div class="weather-descr">
                    <span>Partly cloudy</span>
                    <small>Feels like 17°C</small>
                </div>
          </div>
        
        </section>
        <section class="weather-details">
          <p class="Today" >TODAY</p>
          <h2>Weather details</h2>
          <div class="details">
            <article class="card" > <span class="icon">💧</span>
               <p class="subject">Humidity</p>
               <p class="value">72%</p>
            </article>
            <article class="card"> <span class="icon">🌬️</span>
               <p class="subject">Wind</p>
               <p class="value">14 km/h</p>
            </article>
            <article class="card"> <span class="icon">☀</span>
               <p class="subject">Visibility</p>
               <p class="value">10 km</p>
            </article>
          </div>
        </section>
        </main>
